<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>IconBox</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Toybox, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'tb-row' },
    h(T.IconBox, { icon: 'search' }),
    h(T.IconBox, { icon: 'list', tone: 'mint' }),
    h(T.IconBox, { icon: 'pin', tone: 'pink' }),
    h(T.IconBox, { icon: 'grid', tone: 'pop' })));
</script>
</body>
</html>
